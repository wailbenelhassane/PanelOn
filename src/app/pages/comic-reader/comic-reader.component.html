<app-header></app-header>

<div class="ComicTop">
<h1>
  {{ title }}
</h1>
</div>
<div class="Container">
  <div *ngIf="!pdfLoaded" class="center-container">
    <div class="spinner"></div>
  </div>
  <div  id="pdf-container" #pdfContainter (click)="pageChangeOnClick($event, pdfContainter)">
    <canvas  class="normal" style="cursor:pointer" #pdfCanvas></canvas>
  </div>

  <div id="BottomButtons">
    <div>
      <app-button
        [text]="'reader.fullscreen' | translate"
        (buttonClick)="fullscreen()"
      ></app-button>
    </div>

    <div id="Pagebuttons">
      <button class="page_button" (click)="prevPage()"><</button>
      <input
        id="PageNumber"
        #InputNumber
        type="text"
        min="1"
        max="{{ maxPages }}"
        (input)="numberChecker()"
        (keydown.enter)="pageInputChange()"
        [placeholder]="'reader.pagePlaceholder' | translate:{ page: pageNumber }"
      />
      <button class="page_button" (click)="nextPage()">></button>
    </div>
    <app-button [text]="'reader.savePage' | translate" (buttonClick)="SaveComicPage()" />

  </div>
</div>

<app-comments-section
  [comicId]="comicId"
  [currentUserId]="currentUserId"
></app-comments-section>

<app-footer></app-footer>
